<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGANTIC AI V2 — Live Enterprise Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #070A0F; color: #FFF; font-family: 'Segoe UI', sans-serif; }
        .dash-card { background: #0E1520; border: 1px solid #1E2B3E; border-radius: 12px; padding: 1.5rem; }
        .btn-action { background: linear-gradient(135deg, #00F0FF 0%, #0072FF 100%); color: #000; font-weight: 700; border: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary py-3 px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-bolt text-info me-2"></i> GIGANTIC AI <span class="badge bg-info text-dark">COMMAND DASHBOARD</span></a>
        <span class="text-muted small" id="userEmailBadge"><i class="fa-solid fa-user me-1"></i> Loading account...</span>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="dash-card">
                    <h6 class="text-muted fw-bold">ACTIVE CAMPAIGN</h6>
                    <h3 class="text-info fw-bold" id="dashNicheDisplay">SaaS & Tech</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="dash-card">
                    <h6 class="text-muted fw-bold">TARGET COUNTRY</h6>
                    <h3 class="text-white fw-bold" id="dashCountryDisplay">Global</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="dash-card">
                    <h6 class="text-muted fw-bold">ESTIMATED PIPELINE</h6>
                    <h3 class="text-success fw-bold">$11,300 USD</h3>
                </div>
            </div>
        </div>

        <div class="dash-card">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-building text-info me-2"></i> Targeted Companies & AI Closing Status</h5>
            <div class="table-responsive">
                <table class="table table-dark align-middle">
                    <thead>
                        <tr>
                            <th>Company Name</th>
                            <th>Decision Maker</th>
                            <th>Deal Value</th>
                            <th>AI Closing Strategy</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="targetTableBody">
                        <!-- Loaded dynamically via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FOR DETAILED VIEW -->
    <div class="modal fade text-dark" id="detailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalCompany">Company Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBodyContent">
                    <!-- Dynamic details -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const email = localStorage.getItem('gigantic_email') || 'ceo@company.com';
            document.getElementById('userEmailBadge').innerText = email;

            const res = await fetch('/api/v1/get-targets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (data.status === 'success') {
                const tbody = document.getElementById('targetTableBody');
                tbody.innerHTML = '';
                data.targets.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-bold">${t.company_name}</td>
                        <td>${t.decision_maker}</td>
                        <td class="text-success fw-bold">${t.deal_value}</td>
                        <td><span class="badge bg-secondary">${t.strategy}</span></td>
                        <td><span class="badge ${t.status === 'Closed' ? 'bg-success' : 'bg-warning text-dark'}">${t.status}</span></td>
                        <td><button class="btn btn-sm btn-action" onclick="showDetail('${t.company_name}', '${t.decision_maker}', '${t.deal_value}', '${t.strategy}')">View AI Logs</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });

        function showDetail(company, dm, val, strat) {
            document.getElementById('modalCompany').innerText = company;
            document.getElementById('modalBodyContent').innerHTML = `
                <p><strong>Decision Maker:</strong> ${dm}</p>
                <p><strong>Contract Value:</strong> ${val}</p>
                <p><strong>AI Strategy:</strong> ${strat}</p>
                <hr>
                <p class="small text-muted">AI Agent sent automated outreach, negotiated terms, and handled objections with 100% precision.</p>
            `;
            new bootstrap.Modal(document.getElementById('detailModal')).show();
        }
    </script>
</body>
</html>

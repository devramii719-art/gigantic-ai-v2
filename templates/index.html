<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGANTIC AI 2026 — Alien Swarm UI</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --bg-alien: #010409;
            --card-glass: rgba(13, 22, 38, 0.90);
            --neon-cyan: #00F0FF;
            --neon-green: #00FF85;
            --neon-purple: #A000FF;
        }
        body {
            background-color: var(--bg-alien);
            background-image: radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.15), transparent 50%);
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 50px;
        }
        .glass-panel {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .hero-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF 0%, var(--neon-cyan) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .terminal-log {
            background: #010812;
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--neon-green);
            height: 180px;
            overflow-y: auto;
        }
        .btn-alien {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, #0066FF 100%);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-alien:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        .form-control {
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        .form-control:focus {
            background-color: #0d1626;
            color: #fff;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

    <nav class="navbar bg-dark border-bottom border-info px-4 mb-4">
        <a class="navbar-brand text-white fw-bold" href="#">
            <i class="fa-solid fa-brain text-info me-2"></i> GIGANTIC AI 2026
        </a>
    </nav>

    <div class="container text-center">
        <h1 class="hero-title mb-3">GIGANTIC ALIEN SWARM</h1>
        <p class="text-secondary mb-4">منصة الأتمتة وإدارة الحسابات المباشرة</p>
        
        <div class="row g-4 text-start">
            <!-- كارت الإحصائيات وسجل النظام -->
            <div class="col-lg-6">
                <div class="glass-panel h-100">
                    <h4 class="mb-3 text-info"><i class="fa-solid fa-database me-2"></i> إحصائيات SQLite</h4>
                    <h5 class="mb-3">إجمالي الحسابات: <span id="leadCount" class="text-warning fs-3 fw-bold">0</span></h5>
                    
                    <label class="form-label text-secondary">سجل التحديثات اللحظية (SocketIO Log):</label>
                    <div class="terminal-log" id="logsContainer">
                        <div>[SYSTEM] جاري الاتصال بالسيرفر...</div>
                    </div>
                </div>
            </div>

            <!-- كارت نموذج التسجيل -->
            <div class="col-lg-6">
                <div class="glass-panel h-100">
                    <h4 class="mb-3 text-info"><i class="fa-solid fa-user-plus me-2"></i> إضافة حساب جديد</h4>
                    <form id="trialForm">
                        <div class="mb-3">
                            <label for="uEmail" class="form-label">البريد الإلكتروني</label>
                            <input type="email" id="uEmail" class="form-control bg-dark text-white" placeholder="name@domain.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="uNiche" class="form-label">المجال (Niche)</label>
                            <input type="text" id="uNiche" class="form-control bg-dark text-white" placeholder="مثال: SaaS / E-commerce" required>
                        </div>
                        <div class="mb-3">
                            <label for="uCountry" class="form-label">البلد</label>
                            <input type="text" id="uCountry" class="form-control bg-dark text-white" placeholder="مثال: Algeria / USA" required>
                        </div>
                        <button type="submit" id="btnSubmit" class="btn btn-alien w-100 mt-2">
                            <i class="fa-solid fa-paper-plane me-2"></i> حفظ في الداتابيز
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // الاتصال مع SocketIO
            const socket = io();

            const logsContainer = document.getElementById('logsContainer');
            const leadCount = document.getElementById('leadCount');

            function addLog(msg, colorClass = 'text-success') {
                const time = new Date().toLocaleTimeString();
                logsContainer.innerHTML += `<div class="${colorClass}">[${time}] ${msg}</div>`;
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            // عند نجاح الاتصال
            socket.on('connect', function() {
                addLog('تم الاتصال بالسيرفر بنجاح عبر SocketIO!', 'text-info');
            });

            // استقبال رد السيرفر الأولي
            socket.on('system_response', function(data) {
                addLog(data.data, 'text-warning');
            });

            // استقبال التحديثات الفورية عند إضافة مستخدم جديد
            socket.on('lead_updated', function(data) {
                leadCount.innerText = data.total;
                addLog(`تسجيل جديد: ${data.latest_email} (${data.niche} - ${data.country})`, 'text-success');
            });

            // إرسال البيانات من النموذج
            document.getElementById('trialForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const btn = document.getElementById('btnSubmit');
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> جاري الحفظ...';

                const email = document.getElementById('uEmail').value;
                const niche = document.getElementById('uNiche').value;
                const country = document.getElementById('uCountry').value;

                try {
                    const response = await fetch('/api/v1/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, niche, country })
                    });

                    const resData = await response.json();

                    if (response.ok) {
                        document.getElementById('uEmail').value = '';
                        document.getElementById('uNiche').value = '';
                        document.getElementById('uCountry').value = '';
                    } else {
                        addLog(`خطأ: ${resData.message}`, 'text-danger');
                    }
                } catch (err) {
                    addLog(`خطأ في الاتصال: ${err.message}`, 'text-danger');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> حفظ في الداتابيز';
                }
            });

            // جلب الإحصائيات عند تحميل الصفحة أول مرة
            fetch('/api/v1/auth/stats')
                .then(res => res.json())
                .then(data => {
                    if (data.total !== undefined) {
                        leadCount.innerText = data.total;
                        addLog(`تم تحميل البيانات: الإجمالي الحالي ${data.total}`, 'text-secondary');
                    }
                })
                .catch(err => console.error(err));
        });
    </script>
</body>
</html>
